<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}水闸设计系统{% endblock %}</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#171d24">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/theme.css">
<style>
body { background: var(--surface); }
.auth { display: grid; grid-template-columns: minmax(340px, 42%) 1fr; min-height: 100vh; }

/* ---------- 左：品牌区 ---------- */
.side {
  background: var(--bar); color: #fff;
  padding: 46px 44px;
  display: flex; flex-direction: column; gap: 24px;
}
.side-brand { display: flex; align-items: center; gap: 11px; }
.side-brand img { width: 34px; height: 34px; border-radius: 8px; }
.side-brand span { font-size: 14.5px; font-weight: 600; }
.side h1 { font-size: 27px; font-weight: 600; line-height: 1.4; color: #fff; letter-spacing: -.015em; }
.side .tagline { font-size: 13.5px; color: var(--bar-ink-2); line-height: 1.8; }
.side .spacer { flex: 1; }
.side .rule { height: 1px; background: rgba(255, 255, 255, .1); }
.side ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.side li { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: var(--bar-ink); }
.side li svg { width: 15px; height: 15px; flex: none; margin-top: 3px; color: #6fb0e0; }
.side .ver { font-size: 12px; color: #6b7684; }

/* ---------- 右：表单区 ---------- */
.panel {
  display: flex; align-items: center; justify-content: center;
  padding: 40px 24px; background: var(--surface);
}
.formbox { width: 100%; max-width: 380px; }
.formbox h2 { font-size: 22px; font-weight: 600; }
.formbox .sub { font-size: 13px; color: var(--ink-3); margin: 6px 0 24px; }
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.field input {
  width: 100%; height: 40px; padding: 0 13px;
  border: 1px solid var(--line); border-radius: var(--r-md);
  font-size: 14px; color: var(--ink-1); background: var(--surface);
  transition: border-color .15s, box-shadow .15s;
}
.field input::placeholder { color: var(--ink-4); }
.field input:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(15, 90, 148, .12);
}
.formbox .btn { width: 100%; height: 42px; font-size: 14.5px; }
.flash {
  background: var(--warn-wash); color: var(--warn);
  border: 1px solid #eddfbe; border-radius: var(--r-md);
  padding: 10px 14px; font-size: 13px; margin-bottom: 18px;
}
.foot { text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-3); }

@media (max-width: 860px) {
  .auth { grid-template-columns: 1fr; min-height: auto; }
  .side { padding: 28px 22px; gap: 16px; }
  .side h1 { font-size: 21px; }
  .side .tagline { font-size: 13px; }
  .side ul, .side .spacer, .side .rule, .side .ver { display: none; }
  .panel { align-items: flex-start; padding: 28px 20px 52px; }
}
</style>
</head>
<body>
<div class="auth">
  <aside class="side">
    <div class="side-brand">
      <img src="/static/icons/icon-192.png" alt="">
      <span>水闸设计系统</span>
    </div>
    <h1>水闸设计计算<br>图纸与论文生成</h1>
    <p class="tagline">依据《水闸设计规范》SL 265-2016，从设计参数验证到工程图纸、毕业设计论文，一套流程走完。</p>
    <div class="spacer"></div>
    <div class="rule"></div>
    <ul>
      <li>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.6"/></svg>
        SL 265-2016 规范参数验证与设计计算
      </li>
      <li>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.6"/></svg>
        水闸三维结构仿真与闸门开度调节
      </li>
      <li>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.6"/></svg>
        参数化工程图纸，可导出 DXF 精修
      </li>
      <li>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.6"/></svg>
        毕业设计论文一键生成（Word 格式）
      </li>
    </ul>
  </aside>

  <main class="panel">
    <div class="formbox">
      {% block form %}{% endblock %}
    </div>
  </main>
</div>
</body>
</html>
