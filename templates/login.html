{% extends 'auth_base.html' %}
{% block title %}登录 · 水闸设计论文生成系统{% endblock %}
{% block form %}
<h2>欢迎回来</h2>
<p class="sub">登录后继续使用你的设计工作区</p>
{% with msgs = get_flashed_messages() %}
  {% if msgs %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endif %}
{% endwith %}
<form method="post" action="/login">
  <div class="field">
    <label>用户名</label>
    <input type="text" name="username" placeholder="请输入用户名" required autofocus>
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" name="password" placeholder="请输入密码" required>
  </div>
  <button class="btn" type="submit">登 录</button>
</form>
<div class="foot">还没有账号？<a href="/register">立即注册</a></div>
{% endblock %}
