{% extends 'auth_base.html' %}
{% block title %}注册 · 水闸设计论文生成系统{% endblock %}
{% block form %}
<h2>创建账号</h2>
<p class="sub">需要邀请码才能注册，请联系管理员获取</p>
{% with msgs = get_flashed_messages() %}
  {% if msgs %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endif %}
{% endwith %}
<form method="post" action="/register">
  <div class="field">
    <label>用户名</label>
    <input type="text" name="username" placeholder="3-20 个字符" required autofocus>
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" name="password" placeholder="至少 4 位" required>
  </div>
  <div class="field">
    <label>确认密码</label>
    <input type="password" name="confirm" placeholder="再次输入密码" required>
  </div>
  <div class="field">
    <label>邀请码</label>
    <input type="text" name="invite" placeholder="输入管理员提供的邀请码" required>
  </div>
  <button class="btn" type="submit">注 册</button>
</form>
<div class="foot">已有账号？<a href="/login">返回登录</a></div>
{% endblock %}
