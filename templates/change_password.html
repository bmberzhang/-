{% extends 'auth_base.html' %}
{% block title %}修改密码 · 水闸设计论文生成系统{% endblock %}
{% block form %}
<h2>修改密码</h2>
<p class="sub">修改成功后需要重新登录</p>
{% with msgs = get_flashed_messages() %}
  {% if msgs %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endif %}
{% endwith %}
<form method="post" action="/change-password">
  <div class="field">
    <label>旧密码</label>
    <input type="password" name="old_password" placeholder="输入当前密码" required autofocus>
  </div>
  <div class="field">
    <label>新密码</label>
    <input type="password" name="new_password" placeholder="至少 4 位" required>
  </div>
  <div class="field">
    <label>确认新密码</label>
    <input type="password" name="confirm" placeholder="再次输入新密码" required>
  </div>
  <button class="btn" type="submit">确认修改</button>
</form>
<div class="foot"><a href="/">返回主系统</a></div>
{% endblock %}
